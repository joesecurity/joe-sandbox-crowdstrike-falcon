[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "joe-sandbox-crowdstrike"
version = "0.1.0"
description = "Docker connector between CrowdStrike Falcon and Joe Sandbox Cloud"
requires-python = ">=3.11"
dependencies = ["requests==2.32.5"]

[project.scripts]
joe-falcon = "joe_falcon.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
