services:
  connector:
    build: .
    restart: "on-failure:3"
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 45s
    volumes:
      - ./config.toml:/app/config.toml:ro
      - state:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  state:
